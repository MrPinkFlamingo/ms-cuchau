services:
  postgres-cuchau:
    image: postgres:16-alpine
    container_name: postgres-cuchau
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cuchau_usuarios
    ports:
      - "5432:5432"
    volumes:
      - pgdata_cuchau:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: adminer-cuchau
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres-cuchau

  ms-usuarios:
    build:
      context: ./ms-usuarios
      dockerfile: Dockerfile
    image: ms-usuarios:latest
    container_name: ms-usuarios
    restart: always
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-cuchau:5432/cuchau_usuarios
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password123
    depends_on:
      - postgres-cuchau

volumes:
  pgdata_cuchau:
